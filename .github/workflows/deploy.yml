name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/${{ secrets.EC2_USERNAME }}/Discord-Trivia-Bot-

            # Pull the latest changes
            git pull origin main

            # Check if tmux session exists, create if not
            tmux has-session -t trivia 2>/dev/null
            if [ $? != 0 ]; then
              tmux new-session -d -s trivia
            fi

            # Start the bot in tmux session
            tmux send-keys -t trivia 'python3 main.py' C-m

            # Detach from tmux session
            tmux detach -s trivia

            
          EOF

